server.port=8081

# Same line format as the exercises: time, the FULL thread name (Spring's default cuts it to 15 characters,
# which would hide the coroutine name that -Dkotlinx.coroutines.debug adds), level, logger.
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{20} - %msg%n
logging.level.root=INFO
logging.level.coroutines.workshop=DEBUG
# Switch on when you want to see more, without changing code:
#   logging.level.reactor.netty.http=DEBUG      every HTTP request/response and the Netty thread that serves it
#   .log("coroutines.workshop.signals")         on a Flux/Mono: every Reactive Streams signal (onNext, request(n), cancel)
